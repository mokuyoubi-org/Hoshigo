<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: transparent;
        overflow: hidden;
      }
      #cf-container {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="cf-container"></div>
    <script>
      var params = new URLSearchParams(window.location.search);
      var sitekey = params.get("sitekey");
      var action = params.get("action") || "anonymous_signin";

      var widgetId = null;

      function postToRN(payload) {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify(payload));
        }
      }

      function initTurnstile() {
        if (!window.turnstile) {
          setTimeout(initTurnstile, 100);
          return;
        }
        widgetId = window.turnstile.render("#cf-container", {
          sitekey: sitekey,
          action: action,
          appearance: "interaction-only",
          execution: "execute",
          callback: function (token) {
            postToRN({ type: "token", token: token });
          },
          "error-callback": function (code) {
            postToRN({ type: "error", message: "challenge_failed", code: code });
          },
          "before-interactive-callback": function () {
            postToRN({ type: "interactive", value: true });
          },
          "after-interactive-callback": function () {
            // チェックが終わったときだけモーダルを閉じるようにするにゃ
            postToRN({ type: "interactive", value: false });
          }
        });
        postToRN({ type: "ready" });
      }

      function handleMessage(event) {
        try {
          var data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
          if (data.type === "execute" && widgetId !== null) {
            window.turnstile.reset(widgetId);
            window.turnstile.execute(widgetId);
          }
        } catch (e) {}
      }
      document.addEventListener("message", handleMessage);
      window.addEventListener("message", handleMessage);

      initTurnstile();
    </script>
  </body>
</html>
