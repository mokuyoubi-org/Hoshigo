<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="cf-container"></div>
    <script>
      // sitekeyとactionは、RN側が組み立てたURLのクエリパラメータから受け取る。
      // auto=1の場合、生まれた時から画面上に見えている専用インスタンス
      // (インタラクション対応モーダル用)なので、executeの合図を待たず
      // レンダリングと同時に自動実行する(execution: "render")。
      var params = new URLSearchParams(window.location.search);
      var sitekey = params.get("sitekey");
      var action = params.get("action") || "anonymous_signin";
      var auto = params.get("auto") === "1";
      var widgetId = null;

      function postToRN(payload) {
        window.ReactNativeWebView.postMessage(JSON.stringify(payload));
      }

      function initTurnstile() {
        if (!window.turnstile) {
          setTimeout(initTurnstile, 100);
          return;
        }
        widgetId = window.turnstile.render("#cf-container", {
          sitekey: sitekey,
          action: action,
          appearance: "interaction-only",
          execution: auto ? "render" : "execute",
          callback: function (token) {
            postToRN({ type: "token", token: token });
          },
          "error-callback": function (code) {
            postToRN({
              type: "error",
              message: "challenge_failed",
              code: code,
            });
          },
          "before-interactive-callback": function () {
            postToRN({ type: "interactive", value: true });
          },
          "after-interactive-callback": function () {
            postToRN({ type: "interactive", value: false });
          },
        });
        postToRN({ type: "ready" });
      }

      // RN側からのgetToken要求を受け取る(auto=1の時は使わない)
      function handleMessage(event) {
        try {
          var data = JSON.parse(event.data);
          if (data.type === "execute" && widgetId) {
            window.turnstile.reset(widgetId);
            window.turnstile.execute(widgetId);
          }
        } catch (e) {}
      }
      document.addEventListener("message", handleMessage); // Android
      window.addEventListener("message", handleMessage); // iOS

      initTurnstile();
    </script>
  </body>
</html>
