<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        height: 100%;
      }

      #cf-message {
        box-sizing: border-box;
        height: 100vh;
        padding: 32px 28px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      #cf-spinner {
        width: 40px;
        height: 40px;
        border-width: 3px;
        border-style: solid;
        border-radius: 50%;
        animation: cf-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes cf-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #cf-title {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 8px;
      }

      #cf-subtitle {
        font-size: 14px;
        margin: 0;
        line-height: 1.5;
        max-width: 280px;
      }

      #cf-container {
        display: flex;
        justify-content: center;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div id="cf-message">
      <div id="cf-spinner"></div>
      <p id="cf-title"></p>
      <p id="cf-subtitle"></p>
      <div id="cf-container"></div>
    </div>

    <script>
      var params = new URLSearchParams(window.location.search);
      var sitekey = params.get("sitekey");

      // 言語設定：指定がなければブラウザ設定（navigator.language）にフォールバック
      var rawLang = params.get("lang") || navigator.language;
      var lang = rawLang.split("-")[0]; // "ja-JP" などを "ja" に正規化

      // 色とテーマの設定
      var bgColor = params.get("bgColor");
      var textColor = params.get("textColor");
      var spinnerColor = params.get("spinnerColor");
      var spinnerTrackColor = params.get("spinnerTrackColor");

      // スタイルの適用
      var messageEl = document.getElementById("cf-message");
      var subtitleEl = document.getElementById("cf-subtitle");
      var spinnerEl = document.getElementById("cf-spinner");

      messageEl.style.background = "#" + bgColor;
      messageEl.style.color = "#" + textColor;
      subtitleEl.style.color = "#" + textColor;
      spinnerEl.style.borderColor = "#" + spinnerTrackColor;
      spinnerEl.style.borderTopColor = "#" + spinnerColor;

      // 言語ごとのメッセージ切替
      var messages = {
        ja: {
          title: "人間であることを確認しています",
          subtitle: "画面を閉じずにお待ちください。",
        },
        en: {
          title: "Verifying you're human",
          subtitle: "Please don't close this — it only takes a moment.",
        },
      };

      var msg = messages[lang];
      document.getElementById("cf-title").textContent = msg.title;
      subtitleEl.textContent = msg.subtitle;

      function initTurnstile() {
        if (!window.turnstile) {
          setTimeout(initTurnstile, 100);
          return;
        }
        window.turnstile.render("#cf-container", {
          sitekey: sitekey,
          language: lang,
          appearance: "interaction-only",
          execution: "render",
          callback: function (token) {
            window.location.href =
              "hoshigo://turnstile-callback?token=" + encodeURIComponent(token);
          },
          "error-callback": function (code) {
            window.location.href =
              "hoshigo://turnstile-callback?error=1&code=" +
              encodeURIComponent(code);
          },
        });
      }

      initTurnstile();
    </script>
  </body>
</html>
