<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        height: 100%;
      }

      #cf-message {
        box-sizing: border-box;
        height: 100vh;
        padding: 32px 28px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1a1a1a;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      #cf-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e5e5;
        border-top-color: #f38020; /* Cloudflareオレンジ */
        border-radius: 50%;
        animation: cf-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes cf-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #cf-title {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 8px;
      }

      #cf-subtitle {
        font-size: 14px;
        color: #666666;
        margin: 0;
        line-height: 1.5;
        max-width: 280px;
      }

      #cf-container {
        display: flex;
        justify-content: center;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div id="cf-message">
      <div id="cf-spinner"></div>
      <p id="cf-title">Verifying you're human</p>
      <p id="cf-subtitle">Please don't close this — it only takes a moment.</p>
      <div id="cf-container"></div>
    </div>

    <script>
      // sitekeyとactionは、RN(expo-web-browser)が組み立てたURLの
      // クエリパラメータから受け取る。このページは常に
      // Custom Tabs / SFSafariViewController(本物のブラウザエンジン)で
      // 開かれる前提なので、redirect分岐やpostMessage経路は無く、
      // 常にカスタムスキームへのリダイレクトでトークンを持ち帰る。
      var params = new URLSearchParams(window.location.search);
      var sitekey = params.get("sitekey");
      var action = params.get("action") || "anonymous_signin";

      function initTurnstile() {
        if (!window.turnstile) {
          setTimeout(initTurnstile, 100);
          return;
        }
        window.turnstile.render("#cf-container", {
          sitekey: sitekey,
          action: action,
          appearance: "interaction-only",
          // RN側からexecuteの合図を送る手段が無いので、
          // レンダリングされたら自動で実行する。
          execution: "render",
          callback: function (token) {
            window.location.href =
              "hoshigo://turnstile-callback?token=" + encodeURIComponent(token);
          },
          "error-callback": function (code) {
            window.location.href =
              "hoshigo://turnstile-callback?error=1&code=" +
              encodeURIComponent(code);
          },
        });
      }

      initTurnstile();
    </script>
  </body>
</html>
