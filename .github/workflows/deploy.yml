name: Deploy

on:
  push:
    branches:
      - main
      - preflight # このブランチ名にpushすると、準備(リハーサル)だけが走る
  workflow_dispatch: # 手動で「全部やり直し」したいとき用

# 続けてpushしても、順番に1つずつ処理する(途中で止めない)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ================= 仕分け(どこが変わったかを見る) =================
  changes:
    name: "仕分け: どこが変わったか確認"
    runs-on: ubuntu-latest
    # mainへのpush以外(preflight・手動)は、全部「変わった」扱いにして全部回す
    outputs:
      api: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || steps.filter.outputs.api == 'true' }}
      app: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || steps.filter.outputs.app == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check changed folders
        id: filter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'cloudflare/**'
              - '.github/workflows/**'
            app:
              - 'expo/**'
              - '.github/workflows/**'

  # ================= 準備フェーズ(本番には何も触らない) =================
  build-web:
    name: "準備: Webをビルド"
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_UPDATE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_UPDATE_TOKEN }}
          packager: npm
      - name: Install dependencies
        run: npm ci
      - name: Pull EAS environment variables
        run: npx eas-cli env:pull production --non-interactive
      - name: Check the API URL is the production one
        run: grep -Eq '^EXPO_PUBLIC_API_URL="?https://api\.hoshigo\.app"?$' .env.local
      - name: Build web
        run: npx expo export -p web && node fix-node-modules-path.mjs
      - name: Dry run web Worker deploy
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Save web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: expo/dist
          include-hidden-files: true
          if-no-files-found: error

  check-cloudflare:
    name: "準備: Cloudflareの鍵・権限・Workerを確認"
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check API token is active
        run: |
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -e '.result.status == "active"'
      - name: Check D1 access (read only)
        run: npx wrangler d1 migrations list DB --remote
      - name: Rehearse all migrations on an empty local D1
        run: npx wrangler d1 migrations apply DB --local
      - name: Dry run Worker deploy
        run: npx wrangler deploy --dry-run

  check-native:
    name: "準備: アプリのバンドルとEASの鍵を確認"
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_UPDATE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_UPDATE_TOKEN }}
          packager: npm
      - name: Install dependencies
        run: npm ci
      - name: Check EAS login
        run: npx eas-cli whoami
      - name: Pull EAS environment variables
        run: npx eas-cli env:pull production --non-interactive
      - name: Check native bundle
        run: npx expo export --platform ios --platform android --output-dir dist-native-check

  # ================= 出すフェーズ(mainのときだけ。ここから本番) =================
  # 準備のjobが「飛ばされた」だけなら進む。「失敗した」ときは止まる。
  release-api:
    name: "出す①: D1の棚の工事 → Workerのdeploy"
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true' }}
    needs: [changes, build-web, check-cloudflare, check-native]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        run: npm ci
      # 記録に失敗しても、本番のdeployは止めない
      - name: Record D1 restore point (Time Travel)
        continue-on-error: true
        run: |
          {
            echo "### D1 restore point (before migration)"
            echo '```'
            npx wrangler d1 time-travel info hoshigo-db
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        run: npx wrangler deploy

  release-web:
    name: "出す②: Workersにdeploy"
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true' }}
    needs: [changes, build-web, check-native, release-api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: expo/dist
      - name: Deploy web Worker
        run: npx --yes wrangler@4 deploy

  release-ota:
    name: "出す③: EAS OTA"
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true' }}
    needs: [changes, release-web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_UPDATE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_UPDATE_TOKEN }}
          packager: npm
      - name: Install dependencies
        run: npm ci
      - name: Pull EAS environment variables
        run: npx eas-cli env:pull production --non-interactive
      - name: Run EAS Update
        run: npx eas-cli update --channel default --auto --non-interactive --clear-cache

  # ================= 戻すフェーズ(②か③が失敗したときだけ) =================
  rollback:
    name: "戻す: 成功済みの分を前の状態に"
    needs: [release-api, release-web, release-ota]
    if: ${{ always() && (needs.release-web.result == 'failure' || needs.release-ota.result == 'failure') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        run: npm ci
      # ③(OTA)が失敗したときだけ: ②(Web)を前に戻す
      - name: Roll back web Worker
        if: ${{ needs.release-ota.result == 'failure' }}
        working-directory: expo
        run: npx --yes wrangler@4 rollback --message "auto rollback after failed release ${{ github.sha }}" --yes
      # ①(Worker)が今回成功していたときだけ: 前に戻す(今回触っていないWorkerは戻さない)
      - name: Roll back Worker
        if: ${{ always() && needs.release-api.result == 'success' }}
        run: npx wrangler rollback --message "auto rollback after failed release ${{ github.sha }}" --yes
