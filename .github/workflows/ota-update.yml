name: EAS OTA Update
on:
  push:
    branches:
      - main
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_UPDATE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_UPDATE_TOKEN }}
          packager: npm
      - name: Install dependencies
        run: npm ci
      - name: Pull EAS environment variables
        run: npx eas-cli env:pull production --non-interactive
      - name: Run EAS Update
        run: npx eas-cli update --channel default --auto --non-interactive --clear-cache