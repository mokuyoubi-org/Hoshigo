name: EAS OTA Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_PUBLIC_NAME: ${{ secrets.EXPO_PUBLIC_NAME }}
      EXPO_PUBLIC_SLUG: ${{ secrets.EXPO_PUBLIC_SLUG }}
      EXPO_PUBLIC_SCHEME: ${{ secrets.EXPO_PUBLIC_SCHEME }}
      IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      EXPO_PUBLIC_HOSHIGO_APP_URL: ${{ secrets.EXPO_PUBLIC_HOSHIGO_APP_URL }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EXPO_UPDATES_URL: ${{ secrets.EXPO_UPDATES_URL }}
      EXPO_PUBLIC_APP_STORE_URL: ${{ secrets.EXPO_PUBLIC_APP_STORE_URL }}
      EXPO_PUBLIC_PLAY_STORE_URL: ${{ secrets.EXPO_PUBLIC_PLAY_STORE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_SITEKEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_UPDATE_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Run EAS Update
        run: npx eas-cli update --channel production --auto --non-interactive